<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Open-source movement, explained with evidence.">
  <title>GlimmerHub</title>
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <script>
    try {
      const saved = JSON.parse(localStorage.getItem('glimmerhub-preferences-v1'));
      if (saved && saved.theme === 'dark') document.documentElement.dataset.theme = 'dark';
    } catch {}
  </script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="layout.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="briefing.css">
  <link rel="stylesheet" href="dossier.css">
  <link rel="stylesheet" href="lens-builder.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand-link" href="#briefings" aria-label="GlimmerHub briefing">
        <img class="brand-mark" src="assets/brand/mark.svg" alt="">
        <span class="brand-name">GlimmerHub</span>
      </a>
      <nav class="primary-nav" aria-label="Primary navigation">
        <a class="nav-link" href="#briefings" data-route="briefing">Briefings</a>
        <a class="nav-link" href="#topics" data-route="topics">Topics</a>
        <a class="nav-link" href="#sources" data-route="sources">Sources</a>
      </nav>
      <div class="header-actions">
        <label class="search-control" for="desktop-search">
          <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <input id="desktop-search" data-global-search type="search" placeholder="Search projects" autocomplete="off">
          <span class="key-hint">⌘K</span>
        </label>
        <button class="button button-icon button-quiet" id="theme-toggle" type="button" aria-label="Use dark theme">
          <svg width="17" height="17" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 2v2m0 12v2M2 10h2m12 0h2M4.3 4.3l1.4 1.4m8.6 8.6 1.4 1.4m0-11.4-1.4 1.4m-8.6 8.6-1.4 1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="10" cy="10" r="3.2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
        </button>
      </div>
      <div class="mobile-actions">
        <button class="button button-icon button-quiet" id="mobile-search-toggle" type="button" aria-label="Open search" aria-expanded="false">
          <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="button button-icon button-quiet" id="mobile-menu-toggle" type="button" aria-label="Open menu" aria-expanded="false">
          <svg width="19" height="19" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="mobile-search-panel" id="mobile-search-panel">
    <label class="search-control" for="mobile-search">
      <svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m13 13 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input id="mobile-search" data-global-search type="search" placeholder="Search projects" autocomplete="off">
    </label>
  </div>

  <nav class="lens-rail" aria-label="Saved interest lenses">
    <div class="lens-rail-inner" id="lens-rail-list"></div>
  </nav>

  <nav class="mobile-menu hidden" id="mobile-menu" aria-label="Mobile navigation">
    <a href="#briefings">Briefings</a>
    <a href="#topics">Topics</a>
    <a href="#sources">Sources</a>
    <button type="button" data-mobile-theme>Switch theme</button>
  </nav>

  <main id="app-root"></main>
  <div id="compare-tray-root"></div>
  <div class="sr-only" id="route-status" aria-live="polite"></div>

  <script src="rubric.js"></script>
  <script src="utils.js"></script>
  <script src="data.js"></script>
  <script src="data-physical-ai.js"></script>
  <script src="lenses.js"></script>
  <script src="score.js"></script>
  <script src="lens.js"></script>
  <script src="router.js"></script>
  <script src="render.js"></script>
  <script src="render-home.js"></script>
  <script src="render-dossier.js"></script>
  <script src="render-lenses.js"></script>
  <script src="render-secondary.js"></script>
  <script src="app.js"></script>
</body>
</html>
